<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EURO ID GAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1b4d;--mut:#6a6794;--card:#fff;--line:#e0e1f7;--a:#6d4be0;--b:#3b66e8;--ok:#12a36b;--warn:#e08a00;--bad:#e5484d;--page:linear-gradient(160deg,#dfe7ff,#e8defc 60%,#ddd8fb);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--ink:#eeecff;--mut:#aaa8d4;--card:#1b1946;--line:#312f6a;--page:linear-gradient(160deg,#0f0e2b,#17133a);color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Lao','Noto Sans Thai',system-ui,sans-serif;background:var(--page) fixed;color:var(--ink);line-height:1.55;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--a);min-width:0}
.brand img,.brand .lg{width:42px;height:42px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff}
nav{display:flex;gap:2px;margin-left:auto;align-items:center;overflow-x:auto;max-width:100%}
nav button{background:none;border:0;padding:9px 12px;border-radius:12px;font-weight:600;white-space:nowrap}
nav button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:6px;flex:none}
.lang button{padding:5px 10px;font-size:.85rem;border-radius:0}
.lang button.on{background:var(--ink);color:var(--card)}
.hero{background:linear-gradient(110deg,#7a3fe0,#3b63e8);color:#fff}
.hero.has{background-image:linear-gradient(110deg,#5b2fc8d0,#2f53d8c0),var(--w);background-size:cover;background-position:center}
.hero .wrap{display:flex;align-items:center;gap:28px;padding:36px 16px;justify-content:center;flex-wrap:wrap}
.hero .logo{width:min(220px,50vw);aspect-ratio:1;border-radius:28px;border:4px solid #ffffffcc;object-fit:cover;background:linear-gradient(135deg,#a98bff,#59a2ff);display:grid;place-items:center;font-size:4rem;box-shadow:0 10px 30px #1a0f6a66}
.hero h1{font-size:clamp(1.6rem,4.6vw,2.4rem);line-height:1.2;font-weight:800;max-width:18ch}
.hero p{margin-top:8px;opacity:.92}
.hero .btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.hb{padding:12px 20px;border-radius:14px;font-weight:700;border:2px solid #fff;background:#fff;color:var(--a)}
.hb.o{background:none;color:#fff}
.dot{display:inline-flex;gap:6px;align-items:center;font-size:.9rem}
.dot::before{content:"";width:12px;height:12px;border-radius:50%;background:#3ddc84}
.sec{padding:28px 0 8px;scroll-margin-top:70px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.sh h2{font-size:1.5rem;font-weight:800}.sh span{color:var(--mut);font-size:.9rem}
.sbox{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.sbox input{flex:1;border:0;background:none;padding:12px 0;min-width:0}
.sbox input:focus-visible{outline:none}
.sbox:focus-within{outline:3px solid var(--b)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.chips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600}
.chips button.on{border:2px solid var(--a);color:var(--a);box-shadow:0 0 0 3px #6d4be033}
.tools{display:flex;gap:10px;margin-top:10px}
.tools select{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.tools button{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;white-space:nowrap}
.tools button.on{border:2px solid var(--a);color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:18px 0 8px}
.empty{grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;background:linear-gradient(135deg,#d4e0ff,#e3d6ff) center/cover;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--a)}
.card.sold .thumb{filter:grayscale(1);opacity:.7}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.row{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:8px;background:#6d4be022;color:var(--a)}
.chip.lv{background:#3b66e822;color:var(--b)}
.gid{font-size:1.2rem;font-weight:800}
.note{font-size:.88rem;color:var(--mut)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.foot b{font-size:1.15rem}
.btn{border:0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;padding:10px 18px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.bad{background:var(--bad)}.btn.ok{background:var(--ok)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;display:block;width:100%}
.sc h3{font-size:1.05rem;margin-bottom:4px}.sc p{color:var(--mut);font-size:.9rem}
button.sc:hover{border-color:var(--a)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:800;margin-bottom:8px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a{text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));padding:12px 20px;border-radius:14px;font-weight:700}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:32px 0 40px}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.prev{max-width:100%;max-height:150px;border-radius:12px;margin-top:8px;display:block}
#modal:empty{display:none}
.ov{position:fixed;inset:0;background:#0a0830aa;z-index:50;display:grid;place-items:center;padding:12px;overflow:auto}
.dlg{background:var(--card);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.dlg h3{font-size:1.25rem;margin-bottom:6px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sum{background:#6d4be014;border-radius:14px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pay{background:#6d4be014;border-radius:14px;padding:12px;margin-top:6px;white-space:pre-wrap;font-size:.92rem}
.pay img{max-width:210px;display:block;margin:8px auto 0;border-radius:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 20px;border-radius:14px;z-index:99;font-weight:600}
.at{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px}
.at button{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:14px;font-weight:700}
.at button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent}
.at em{font-style:normal;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-size:.78rem;margin-left:6px}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.item .th{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#d4e0ff,#e3d6ff) center/cover;flex:none}
.item .info{flex:1;min-width:160px}
.item small{color:var(--mut);display:block}
.ba{display:flex;gap:6px;flex-wrap:wrap}
.st{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:8px;color:#fff;display:inline-block}
.st.available,.st.confirmed,.st.resolved{background:var(--ok)}.st.reserved,.st.pending,.st.open,.st.progress{background:var(--warn)}.st.sold,.st.cancelled{background:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.slip{max-width:150px;border-radius:10px;margin-top:6px;cursor:pointer}
h4{margin:18px 0 8px}
</style>
</head>

function readImg(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}

 if(!S.orders.find(x=>x.id===n&&x.contact===p&&x.status==='confirmed'))return toast(t('orderBad'));
 const id='CL'+String(S.seq.c++).padStart(4,'0');
 S.claims.unshift({id,oid:n,contact:p,reason:$('#cr').value,detail:d,status:'open',reply:'',date:Date.now()});save();
 modal(`<h3>✅ ${t('claimOk')}</h3><div class="sum"><b style="font-size:1.6rem">${id}</b></div><div class="acts"><button class="btn" data-act="close">OK</button></div>`);
}

function loginModal(){modal(`<h3>${t('login')}</h3><label for="pw">${t('pass')}</label><input id="pw" type="password"><div class="acts"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn" data-act="login">${t('enter')}</button></div>`);
 setTimeout(()=>{const e=$('#pw');e?.focus();e?.addEventListener('keydown',ev=>{if(ev.key==='Enter')doLogin()})},0)}
function doLogin(){if(val('pw')===S.settings.pass){isAdmin=true;route='admin';closeModal();render()}else toast(t('wrongPass'))}
function adminView(){
 const pend=S.orders.filter(o=>o.status==='pending').length,oc=S.claims.filter(c=>c.status!=='resolved').length;
 const badge=n=>n?`<em>${n}</em>`:'';
 const tabs=[['prods',''],['cats',''],['orders',badge(pend)],['claims',badge(oc)],['settings','']];
 $('#view').innerHTML=`<div class="wrap"><div class="at">${tabs.map(([x,b])=>`<button class="${tab===x?'on':''}" data-act="tab" data-t="${x}">${t(x)}${b}</button>`).join('')}<button data-act="logout">${t('logout')}</button></div><div id="ap"></div></div>`;
 ({prods:aProds,cats:aCats,orders:aOrders,claims:aClaims,settings:aSettings})[tab]();
}
function aProds(){
 $('#ap').innerHTML=`<div class="bar"><button class="btn" data-act="pform">+ ${t('addId')}</button><button class="btn ghost" data-act="bulk">+ ${t('addBulk')}</button></div>`+
 (S.prods.map(p=>`<div class="item"><div class="th" ${p.img?`style="background-image:url('${p.img}')"`:''}></div><div class="info"><b>ID ${h(p.gid)}</b> <span class="st ${p.status}">${t(p.status)}</span><small>${h(nm(catOf(p.cat)))} · Lv. ${h(p.lv)} · ${money(p.price)}</small></div><div class="ba"><button class="btn ghost sm" data-act="pform" data-id="${p.id}">${t('edit')}</button><button class="btn bad sm" data-act="pdel" data-id="${p.id}">${t('del')}</button></div></div>`).join('')||`<p class="note">${t('empty')}</p>`);
}
function pform(id){
 const p=S.prods.find(x=>x.id===id)||{cat:S.cats[0]?.id,gid:'',lv:'',price:'',status:'available',note:'',img:'',deliver:''};
 tmp.img=p.img;
 modal(`<h3>${id?t('edit'):t('addId')}</h3><label>${t('category')}</label><select id="pc">${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${h(nm(c))}</option>`).join('')}</select>
 <div class="two"><div><label>${t('accId')}</label><input id="pg" type="text" value="${h(p.gid)}"></div><div><label>${t('level')}</label><input id="pl" type="number" value="${h(p.lv)}"></div></div>
 <div class="two"><div><label>${t('price')}</label><input id="pp" type="number" value="${h(p.price)}"></div><div><label>${t('status')}</label><select id="ps">${['available','reserved','sold'].map(x=>`<option value="${x}" ${x===p.status?'selected':''}>${t(x)}</option>`).join('')}</select></div></div>
 <label>${t('image')}</label><input type="file" accept="image/*" data-up="img"><img id="pv-img" class="prev" ${p.img?`src="${p.img}"`:'hidden'} alt="">
 <label>${t('note')}</label><input id="pn" type="text" value="${h(p.note)}"><label>${t('deliver')}</label><textarea id="pd">${h(p.deliver)}</textarea>
 <div class="acts"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn" data-act="psave" data-id="${id||''}">${t('save')}</button></div>`);
}
function psave(id){
 const o={cat:$('#pc').value,gid:val('pg'),lv:val('pl'),price:Number(val('pp'))||0,status:$('#ps').value,note:val('pn'),deliver:$('#pd').value,img:tmp.img||''};
 if(!o.gid)return;
 if(id)Object.assign(S.prods.find(x=>x.id===id),o);else S.prods.unshift({id:'p'+(S.seq.p++),...o});
 save();closeModal();render();
}
function bulkForm(){
 modal(`<h3>${t('addBulk')}</h3><label>${t('category')}</label><select id="bc2">${S.cats.map(c=>`<option value="${c.id}">${h(nm(c))}</option>`).join('')}</select>
 <label>${t('defPrice')}</label><input id="bp" type="number"><label>${t('bulkHelp')}</label><textarea id="bt" style="min-height:160px" placeholder="1851701902, 78, 3450000"></textarea>
 <div class="acts"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn" data-act="bsave">${t('save')}</button></div>`);
}
function bulkSave(){
 const dp=Number(val('bp'))||0;let n=0;
 $('#bt').value.split('\n').forEach(line=>{const a=line.split(/[,\t]/).map(x=>x.trim());if(!a[0])return;
  S.prods.unshift({id:'p'+(S.seq.p++),cat:$('#bc2').value,gid:a[0],lv:a[1]||'',price:Number(a[2])||dp,status:'available',note:'',img:'',deliver:''});n++});
 save();closeModal();toast(t('bulkOk')+' '+n);render();
}
function listEditor(key,title){
 return `<h4>${title}</h4>`+S[key].map(c=>`<div class="item"><div class="info"><b>${h(c.th)}</b><small>${h(c.lo)}</small></div><div class="ba"><button class="btn ghost sm" data-act="cform" data-k="${key}" data-id="${c.id}">${t('edit')}</button><button class="btn bad sm" data-act="cdel" data-k="${key}" data-id="${c.id}">${t('del')}</button></div></div>`).join('')+`<button class="btn sm" data-act="cform" data-k="${key}">+ ${t('add')}</button>`;
}
function aCats(){$('#ap').innerHTML=listEditor('cats',t('catsGame'))+listEditor('reasons',t('reasons'))}
function cform(k,id){
 const c=S[k].find(x=>x.id===id)||{th:'',lo:''};
 modal(`<h3>${id?t('edit'):t('add')}</h3><label>${t('nameTh')}</label><input id="cth" type="text" value="${h(c.th)}"><label>${t('nameLo')}</label><input id="clo" type="text" value="${h(c.lo)}">
 <div class="acts"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn" data-act="csave" data-k="${k}" data-id="${id||''}">${t('save')}</button></div>`);
}
function csave(k,id){
 const th=val('cth'),lo=val('clo')||th;if(!th)return;
 if(id)Object.assign(S[k].find(x=>x.id===id),{th,lo});else S[k].push({id:'k'+(S.seq.k++),th,lo});
 save();closeModal();render();
}
function aOrders(){
 $('#ap').innerHTML=S.orders.map(o=>`<div class="item"><div class="info"><b>${o.id} · ${h(o.label)}</b> <span class="st ${o.status}">${t(o.status)}</span><small>${t('customer')}: ${h(o.name)} · ${h(o.contact)}</small><small>${money(o.price)} · ${fmtDate(o.date)}</small>${o.slip?`<img class="slip" src="${o.slip}" data-act="zoom" alt="slip">`:''}</div>
 ${o.status==='pending'?`<div class="ba"><button class="btn ok sm" data-act="oconf" data-id="${o.id}">${t('markSold')}</button><button class="btn bad sm" data-act="ocancel" data-id="${o.id}">${t('cancelOrder')}</button></div>`:''}</div>`).join('')||`<p class="note" style="padding-top:12px">${t('empty')}</p>`;
}
function aClaims(){
 $('#ap').innerHTML=S.claims.map(c=>`<div class="item"><div class="info"><b>${c.id} · ${c.oid}</b> <span class="st ${c.status}">${t(c.status)}</span><small>${h(nm(S.reasons.find(r=>r.id===c.reason)))} · ${h(c.contact)}</small><small>${h(c.detail)}</small>${c.reply?`<small>↳ ${h(c.reply)}</small>`:''}</div><div class="ba"><button class="btn ghost sm" data-act="clform" data-id="${c.id}">${t('edit')}</button></div></div>`).join('')||`<p class="note" style="padding-top:12px">${t('empty')}</p>`;
}
function clform(id){
 const c=S.claims.find(x=>x.id===id);
 modal(`<h3>${c.id}</h3><p class="note">${h(c.detail)}</p><label>${t('status')}</label><select id="cs">${['open','progress','resolved'].map(x=>`<option value="${x}" ${x===c.status?'selected':''}>${t(x)}</option>`).join('')}</select>
 <label>${t('reply')}</label><textarea id="crp">${h(c.reply)}</textarea><div class="acts"><button class="btn ghost" data-act="close">${t('cancel')}</button><button class="btn" data-act="clsave" data-id="${id}">${t('save')}</button></div>`);
}
function imgField(key,label){
 const v=S.settings[key];
 return `<div class="panel"><b>${label}</b><br><input type="file" accept="image/*" data-up="set-${key}" style="margin-top:8px">${v?`<img class="prev" src="${v}" alt=""><button class="btn bad sm" style="margin-top:8px" data-act="rmimg" data-k="${key}">${t('removeImg')}</button>`:''}</div>`;
}
function aSettings(){
 const s=S.settings;
 $('#ap').innerHTML=imgField('logo',t('logo'))+imgField('wall',t('wall'))+imgField('qr',t('qr'))+`<div class="panel"><label>${t('shopName')}</label><input id="sn" type="text" value="${h(s.name)}">
 <label>${t('heroTh')}</label><input id="sht" type="text" value="${h(s.hero_th)}"><label>${t('heroLo')}</label><input id="shl" type="text" value="${h(s.hero_lo)}">
 <label>${t('subTh')}</label><input id="sst" type="text" value="${h(s.sub_th)}"><label>${t('subLo')}</label><input id="ssl" type="text" value="${h(s.sub_lo)}">
 <label>${t('cur')}</label><input id="sc" type="text" value="${h(s.cur)}">
 <label>${t('bank')}</label><textarea id="sb">${h(s.bank)}</textarea>
 <div class="two"><div><label>${t('cPhone')}</label><input id="sp" type="text" value="${h(s.phone)}"></div><div><label>${t('cWa')}</label><input id="sw" type="text" value="${h(s.wa)}"></div></div>
 <div class="two"><div><label>${t('cFb')}</label><input id="sf" type="text" value="${h(s.fb)}"></div><div><label>${t('cLine')}</label><input id="sl" type="text" value="${h(s.line)}"></div></div>
 <label>${t('newPass')}</label><input id="spw" type="password" placeholder="••••••••">
 <div class="acts"><button class="btn" data-act="ssave">${t('save')}</button></div><p class="note" style="margin-top:10px">${t('demo')}</p></div>`;
}
function ssave(){
 const s=S.settings;
 Object.assign(s,{name:val('sn')||s.name,hero_th:val('sht'),hero_lo:val('shl'),sub_th:val('sst'),sub_lo:val('ssl'),cur:val('sc')||'₭',bank:$('#sb').value,phone:val('sp'),wa:val('sw'),fb:val('sf'),line:val('sl')});
 if(val('spw').length>=4)s.pass=val('spw');
 save();render();
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,d=el.dataset;
 if(a==='ovclose'){if(e.target===el)closeModal();return}
 if(a==='zoom'){modal(`<img src="${el.src}" style="width:100%;border-radius:12px" alt=""><div class="acts"><button class="btn" data-act="close">OK</button></div>`);return}
 const A={
  go:()=>{if(d.r==='admin'&&!isAdmin)return loginModal();route=d.r;render();scrollTo(0,0)},
  scroll:()=>document.getElementById('s-'+d.s)?.scrollIntoView(),
  lang:()=>{lang=d.l;try{localStorage.setItem('euro-id-lang',lang)}catch(_){}render()},
  filter:()=>{filter=d.f;list()},soldtoggle:()=>{showSold=!showSold;list()},
  buy:()=>buyModal(d.id),order:()=>placeOrder(d.id),close:closeModal,
  trackm:trackModal,claimm:claimModal,track,sendclaim:sendClaim,
  login:doLogin,logout:()=>{isAdmin=false;route='shop';render()},
  tab:()=>{tab=d.t;render()},
  pform:()=>pform(d.id),psave:()=>psave(d.id),bulk:bulkForm,bsave:bulkSave,
  pdel:()=>{if(confirm(t('confirmDel'))){S.prods=S.prods.filter(p=>p.id!==d.id);save();render()}},
  cform:()=>cform(d.k,d.id),csave:()=>csave(d.k,d.id),
  cdel:()=>{if(confirm(t('confirmDel'))){S[d.k]=S[d.k].filter(c=>c.id!==d.id);save();render()}},
  oconf:()=>{const o=S.orders.find(x=>x.id===d.id);o.status='confirmed';const p=S.prods.find(x=>x.id===o.pid);if(p)p.status='sold';save();render()},
  ocancel:()=>{const o=S.orders.find(x=>x.id===d.id);o.status='cancelled';const p=S.prods.find(x=>x.id===o.pid);if(p)p.status='available';save();render()},
  clform:()=>clform(d.id),
  clsave:()=>{Object.assign(S.claims.find(x=>x.id===d.id),{status:$('#cs').value,reply:$('#crp').value});save();closeModal();render()},
  ssave,rmimg:()=>{S.settings[d.k]='';save();render()}
 };
 A[a]?.();
});
document.addEventListener('change',async e=>{
 const el=e.target;if(!el.dataset.up||!el.files[0])return;
 const k=el.dataset.up;
 if(k.startsWith('set-')){const key=k.slice(4);S.settings[key]=await readImg(el.files[0],key==='wall'?1600:key==='logo'?400:600);save();render();return}
 const url=await readImg(el.files[0],k==='slip'?900:700);tmp[k]=url;
 const pv=$('#pv-'+k);if(pv){pv.src=url;pv.hidden=false}
});

load().then(render);
</script>
</body>
</html>
